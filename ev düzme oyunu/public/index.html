<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İç Mimar — Evini Kendin Dizayn Et</title>
<style>
  :root{
    --bg:#f3eee6;
    --panel:#fffdf9;
    --panel2:#faf6ef;
    --ink:#2b2724;
    --muted:#8b8178;
    --line:#e6ddd1;
    --accent:#c2603a;
    --accent-ink:#ffffff;
    --ok:#2f7d46;
    --bad:#b83b32;
    --radius:12px;
    --shadow:0 18px 40px -28px rgba(70,45,25,.75);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button,input{font:inherit;color:inherit}

  /* ---------- header ---------- */
  .top{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(150deg,#e0873f,#c2603a);font-size:18px;
    box-shadow:0 6px 14px -6px rgba(194,96,58,.9)
  }
  .brand h1{margin:0;font-size:16px;letter-spacing:.2px}
  .brand small{display:block;color:var(--muted);font-size:11.5px}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
  .ctl input[type=number]{
    width:56px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel2);text-align:center;font-weight:600;color:var(--ink)
  }
  .swatches{display:flex;gap:6px}
  .sw{
    width:24px;height:24px;border-radius:7px;border:2px solid transparent;
    cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)
  }
  .sw[aria-pressed=true]{border-color:var(--accent);transform:scale(1.08)}
  .btn{
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:6px 12px;font-size:13px;cursor:pointer;transition:.14s;
  }
  .btn:hover{background:#fff;border-color:#d8ccbc}
  .btn.danger{color:var(--bad)}

  /* ---------- layout ---------- */
  main{flex:1;min-height:0;display:grid;grid-template-columns:252px 1fr}

  /* ---------- catalog ---------- */
  .catalog{
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0
  }
  .cat-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:11px 14px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted)
  }
  .cat-list{overflow:auto;padding:0 12px 18px;flex:1;min-height:0}
  .grp{margin-bottom:16px}
  .grp h3{
    margin:12px 2px 8px;font-size:12.5px;font-weight:700;color:var(--ink);
    display:flex;align-items:center;gap:7px
  }
  .grp h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 7px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;cursor:grab;text-align:center;transition:.13s;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
  }
  .ctl .t{white-space:nowrap}
  .actions{display:flex;gap:8px}
  .pal-wrap{position:relative}
  .sw.plus{font-size:17px;font-weight:700;color:var(--accent);background:var(--panel2);border:1px dashed #cdbfae;line-height:1}
  .pal{
    position:absolute;top:calc(100% + 8px);right:0;z-index:40;width:214px;padding:11px;
    background:var(--panel);border:1px solid var(--line);border-radius:13px;
    box-shadow:0 24px 48px -24px rgba(0,0,0,.55)
  }
  .pal[hidden]{display:none}
  .pal-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .pal-sw{width:100%;aspect-ratio:1;border-radius:8px;border:1.5px solid rgba(0,0,0,.18);cursor:pointer;padding:0;transition:.12s}
  .pal-sw:hover{transform:scale(1.14)}
  .pal-custom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;font-size:12px;color:var(--muted)}
  .pal-custom input{width:46px;height:28px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}

  .modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(30,22,16,.62)}
  .modal[hidden]{display:none}
  .modal-box{
    background:var(--panel);border-radius:16px;padding:16px;width:100%;max-width:min(560px,94vw);
    max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 34px 70px -34px #000
  }
  .modal-box h3{margin:0;font-size:15px}
  .modal-box .frame{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px;display:grid;place-items:center}
  .modal-box img{display:block;max-width:100%;max-height:52vh;border-radius:6px}
  .modal-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .modal-note{flex:1 1 100%;font-size:12px;color:var(--muted);line-height:1.4}
  .dl{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
    border:none;text-decoration:none;padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer
  }
  .dl:hover{background:#ad5231}
  .card:hover{background:#fff;border-color:#d6c9b7;transform:translateY(-1px);box-shadow:var(--shadow)}
  .card:active{cursor:grabbing}
  .card.armed{border-color:var(--accent);box-shadow:0 0 0 2px rgba(194,96,58,.28);background:#fff}
  .card .chip{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px}
  .card .nm{font-size:11.5px;font-weight:600;line-height:1.2}
  .card .sz{font-size:10px;color:var(--muted);letter-spacing:.04em}
  .hand{
    width:100%;margin-bottom:4px;padding:7px;border:1px dashed var(--line);
    background:transparent;border-radius:9px;font-size:12.5px;cursor:pointer;color:var(--muted)
  }
  .hand.armed{border-color:var(--accent);color:var(--accent);background:#fff}

  /* ---------- stage ---------- */
  .stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
  .stagebar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)
  }
  .chip{
    font-size:12.5px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:999px;padding:4px 11px;white-space:nowrap
  }
  .chip b{color:var(--ink);font-weight:700}
  .chip.sel{background:#fff5ef;border-color:#e9c6b3;color:var(--accent)}
  .mini{
    padding:5px 10px;font-size:12.5px;border-radius:8px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);transition:.13s
  }
  .mini:hover:not(:disabled){background:#fff;border-color:#d6c9b7}
  .mini:disabled{opacity:.42;cursor:default}
  .mini.danger{color:var(--bad)}
  .mini.danger:hover:not(:disabled){border-color:#e3b1ad;background:#fff5f4}

  .roomWrap{
    flex:1;min-height:0;display:grid;place-items:center;padding:26px;overflow:auto;
    container-type:size;
    background:
      radial-gradient(1200px 500px at 50% -10%, #fffdf9 0%, rgba(255,253,249,0) 70%),
      repeating-linear-gradient(45deg, rgba(0,0,0,.02) 0 2px, transparent 2px 12px);
  }
  .room{
    position:relative;
    width:min(100%, 74vh);
    width:min(100%, 100cqmin);
    aspect-ratio:1/1;
    background-color:var(--floor,#e8cfa4);
    background-image:
      linear-gradient(to right, rgba(0,0,0,.13) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,.13) 1px, transparent 1px);
    background-size:calc(100% / var(--n,10)) calc(100% / var(--n,10));
    border-radius:10px;
    box-shadow:
      inset 0 0 0 3px rgba(43,39,36,.55),
      0 0 0 9px #fffdf9,
      0 0 0 10px var(--line),
      0 34px 60px -34px rgba(70,45,25,.8);
    touch-action:none;-webkit-user-select:none;user-select:none;
  }
  .items{position:absolute;inset:0}
  .item{
    position:absolute;border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;overflow:hidden;cursor:grab;
    border:1.5px solid rgba(0,0,0,.28);
    box-shadow:0 6px 12px -8px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.35);
    transition:box-shadow .14s, opacity .14s;
    -webkit-user-select:none;user-select:none;touch-action:none;
  }
  .item:active{cursor:grabbing}
  .item .ico{line-height:1;text-shadow:0 2px 4px rgba(0,0,0,.22)}
  .item .lbl{font-weight:700;letter-spacing:.01em;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94%}
  .item.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:6}
  .item.dragging{opacity:.28;outline:2px dashed rgba(43,39,36,.6);box-shadow:none}
  .item.preview{pointer-events:none;z-index:9;border-radius:9px;opacity:.85}
  .item.preview.ok{background:rgba(70,165,95,.72)!important;border-color:var(--ok);outline:2px solid var(--ok);color:#0d2b17!important}
  .item.preview.bad{background:rgba(206,74,62,.7)!important;border-color:var(--bad);outline:2px solid var(--bad);color:#fff!important}
  .item.ghost-in{opacity:.32;outline:2px dashed rgba(43,39,36,.55)}
  #preview[hidden],.item[hidden]{display:none}

  .status{
    padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);
    font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap
  }
  .status b{color:var(--ink);font-weight:600}
  .status .flash{color:var(--accent)}

  #ghost{
    position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;
    background:#fff;border:1.5px solid var(--accent);box-shadow:0 14px 26px -14px rgba(0,0,0,.7);
    font-size:13px;font-weight:600;opacity:.95
  }
  #ghost[hidden]{display:none}

  /* ---------- dokunmatik ---------- */
  @media (pointer:coarse){
    .btn,.mini{min-height:38px;padding:8px 13px}
    .sw{width:30px;height:30px}
    .card{padding:11px 6px 9px}
    .card .chip{width:38px;height:38px;font-size:20px}
    .card .nm{font-size:12.5px}
    .roomWrap{overflow:auto;-webkit-overflow-scrolling:touch}
    .cat-list{overscroll-behavior:contain;touch-action:pan-x}
    .card{touch-action:pan-x}
    #ghost{display:none}
  }

  /* ---------- responsive (telefon / tablet) ---------- */
  @media (max-width:880px){
    .top{
      display:grid;grid-template-columns:auto minmax(0,1fr);
      grid-template-areas:"brand actions" "size floors";
      align-items:center;gap:6px 10px;padding:8px 10px
    }
    .top .spacer{display:none}
    .brand{grid-area:brand}
    .actions{grid-area:actions;justify-self:end;gap:7px}
    .ctl-size{grid-area:size;justify-self:start}
    .pal-wrap{grid-area:floors;justify-self:end;min-width:0}
    .swatches{overflow-x:auto;max-width:100%;scrollbar-width:none}
    .only-wide{display:none}
    .brand small{display:none}
    .brand .logo{width:30px;height:30px;font-size:16px}
    .brand h1{font-size:15px}
    .ctl{font-size:12.5px;gap:5px}
    .ctl .t{display:none}
    .ctl input[type=number]{width:50px;padding:6px 4px}
    .btn{padding:7px 10px;font-size:12.5px}
    .sw{width:24px;height:24px}

    main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
    .stage,.catalog{min-width:0}
    .stage{order:1;min-height:0}
    .catalog{
      order:2;border-right:none;border-top:1px solid var(--line);
      max-height:172px;min-height:0
    }
    .cat-head{padding:6px 12px 4px;font-size:11px}
    .cat-list{
      display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;
      padding:0 12px 12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch
    }
    .grp{margin-bottom:0;min-width:max-content}
    .grp h3{margin:6px 2px 6px;font-size:11.5px}
    .grp h3::after{display:none}
    .cards{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));width:max-content;gap:7px}
    .card{min-width:84px;touch-action:pan-x}
    .hand{width:auto;min-width:132px;margin-bottom:0;align-self:flex-start;padding:8px 12px}

    .stagebar{
      padding:7px 10px;gap:7px;flex-wrap:nowrap;overflow-x:auto;min-width:0;
      scrollbar-width:none;-webkit-overflow-scrolling:touch
    }
    .stagebar::-webkit-scrollbar{display:none}
    .stagebar .chip{order:3;flex:0 0 auto}
    .stagebar .spacer{display:none}
    .stagebar .mini{order:1;flex:0 0 auto}
    .stagebar .mini:first-of-type{margin-left:auto}

    .roomWrap{padding:14px}
    .room{
      box-shadow:
        inset 0 0 0 3px rgba(43,39,36,.55),
        0 0 0 6px #fffdf9,
        0 0 0 7px var(--line),
        0 22px 44px -30px rgba(70,45,25,.8);
    }
    .status{padding:6px 12px;font-size:11.5px;gap:10px}
    #ghost{display:none}
  }
  @media (max-width:880px) and (orientation:landscape){
    .catalog{max-height:120px}
    .cat-head{display:none}
    .status{display:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo">🏠</span>
    <div>
      <h1>İç Mimar</h1>
      <small>evini kendin dizayn et</small>
    </div>
  </div>
  <div class="spacer"></div>

  <label class="ctl ctl-size"><span class="t">Oda ölçüyü</span>
    <input id="size" type="number" inputmode="numeric" min="5" max="24" step="1" value="10" aria-label="Oda kenarı (kare)">
    × <span id="sizeEcho">10</span>
  </label>

  <div class="ctl pal-wrap"><span class="t">Zemin</span> <span class="swatches" id="floors"></span><button class="sw plus" id="palBtn" title="Renk paleti" aria-haspopup="true" aria-expanded="false">+</button>
    <div class="pal" id="pal" hidden>
      <div class="pal-title">Renk paleti</div>
      <div class="pal-grid" id="palGrid"></div>
      <label class="pal-custom">Özel renk <input type="color" id="palCustom" value="#e8cfa4"></label>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="saveBtn">💾 Kaydet<span class="only-wide"> (PNG)</span></button>
    <button class="btn danger" id="clearBtn"><span class="only-wide">Odayı </span>Temizle</button>
  </div>
</header>

<main>
  <aside class="catalog">
    <div class="cat-head">Eşyalar <span id="catHint">sürükle</span></div>
    <div class="cat-list" id="catList"></div>
  </aside>

  <section class="stage">
    <div class="stagebar">
      <span class="chip" id="stats">—</span>
      <span class="chip sel" id="selChip" hidden>—</span>
      <span class="spacer"></span>
      <button class="mini" id="rotBtn" disabled>⟳ Döndür <span style="opacity:.6">R</span></button>
      <button class="mini" id="dupBtn" disabled>⧉ Kopyala</button>
      <button class="mini danger" id="delBtn" disabled>🗑 Sil <span style="opacity:.6">Del</span></button>
    </div>

    <div class="roomWrap">
      <div class="room" id="room">
        <div class="items" id="items"></div>
        <div class="item preview" id="preview" hidden></div>
      </div>
    </div>

    <div class="status">
      <span id="hint"><b>Eşyayı seçip boş bir kareye bırak.</b> R ile döndür · Delete ile sil · Esc iptal</span>
      <span id="mode"></span>
    </div>
  </section>
</main>

<div id="ghost" hidden></div>

<div class="modal" id="saveModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="Odayi gorsel olarak kaydet">
    <h3>📸 Oda planın hazır</h3>
    <div class="frame"><img id="saveImg" alt="Oda planı"></div>
    <div class="modal-actions">
      <a class="dl" id="saveLink" download="oda.png">⬇ PNG indir</a>
      <button class="btn" id="saveClose">Kapat</button>
      <span class="modal-note">Telefonda: görsele <b>basılı tutup “Görseli kaydet”</b> diyebilirsin — her cihazda çalışır.</span>
    </div>
  </div>
</div>

    { id:"pencere",  name:"Pencere",       emoji:"🪟", w:2, h:1, color:"#8fbcd4" },
  ]},
];

const TYPES = {};
CATALOG.forEach(g => g.items.forEach(it => { TYPES[it.id] = it; }));

const FLOORS = [
  { id:"parke",  name:"Parke",      color:"#e8cfa4" },
  { id:"acik",   name:"Açık ahşap", color:"#f2e0c6" },
  { id:"koyu",   name:"Koyu ahşap", color:"#c9a275" },
  { id:"mermer", name:"Mermer",     color:"#e9edf0" },
  { id:"mozaik", name:"Mozaik",     color:"#dde7e3" },
  { id:"beyaz",  name:"Beyaz",      color:"#f6f5f2" },
  { id:"kil",    name:"Kil",        color:"#e3b8a2" },
];

/* “+” ile açılan geniş renk paleti */
const PALETTE = [
  "#e8cfa4","#f2e0c6","#c9a275","#a87a4e","#7d5636","#5b3d27",
  "#f6f5f2","#e9edf0","#d7dee3","#b9c4cb","#8fa0aa","#5d6b74",
  "#f3dcd6","#e3b8a2","#d99a86","#c9766a","#e8b4b8","#d98fa6",
  "#e6efdf","#c3ddb4","#9cc9a4","#7fb98f","#5f9e7a","#3f7f5f",
  "#f7e6b8","#f0d178","#e8b84b","#d99a2b","#f2c9a0","#c58bd6"
];

/* ============================ durum ============================ */
const KEY = "icmimar.room.v1";
const MIN = 5, MAX = 24;

let state = { size:10, floor:"parke", floorColor:null, items:[] };
let palOpen = false;
let sel = null;              // seçili eşyanın uid'si
let armed = null;            // { type, rot } — tıkla-yerleştir modu
let drag = null;             // aktif sürükleme
let lastPt = null;           // son imleç konumu
let flashTimer = null;

const $ = s => document.querySelector(s);
const roomEl = $("#room"), itemsEl = $("#items"), previewEl = $("#preview"),
      ghostEl = $("#ghost"), catList = $("#catList"), statsEl = $("#stats"),
      selChip = $("#selChip"), modeEl = $("#mode"), hintEl = $("#hint"),
      sizeInput = $("#size"), sizeEcho = $("#sizeEcho");

const DEFAULT_HINT = hintEl.innerHTML;

/* ---------- yardımcılar ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const dims = it => {
  const t = TYPES[it.type];
  return it.rot ? { w:t.h, h:t.w } : { w:t.w, h:t.h };
};
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function luminance(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
const floorColor = () => state.floorColor ||
  (FLOORS.find(f => f.id === state.floor) || FLOORS[0]).color;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s && Number.isFinite(s.size) && Array.isArray(s.items)){
      state.size = Math.min(MAX, Math.max(MIN, Math.round(s.size)));
      state.floor = FLOORS.some(f => f.id === s.floor) ? s.floor : "parke";
      state.floorColor = typeof s.floorColor === "string" && /^#[0-9a-f]{6}$/i.test(s.floorColor)
        ? s.floorColor : null;
      state.items = s.items.filter(it => TYPES[it.type])
        .map(it => ({ uid:it.uid || uid(), type:it.type, x:it.x|0, y:it.y|0, rot:it.rot ? 1 : 0 }))
        .filter(inBounds);
    }
  }catch(e){ /* bozuk kayıt yoksayılır */ }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------- kurallar ---------- */
function box(type, rot, x, y){
  const t = TYPES[type];
  const w = rot ? t.h : t.w, h = rot ? t.w : t.h;
  return { x, y, w, h };
}
function inBounds(it){
  const d = dims(it);
  return it.x >= 0 && it.y >= 0 && it.x + d.w <= state.size && it.y + d.h <= state.size;
}
function canPlace(type, rot, x, y, ignoreUid){
  const t = TYPES[type];
  const w = rot ? t.h : t.w, h = rot ? t.w : t.h;
  if(x < 0 || y < 0 || x + w > state.size || y + h > state.size) return false;
  for(const it of state.items){
    if(it.uid === ignoreUid) continue;
    const d = dims(it);
    if(x < it.x + d.w && x + w > it.x && y < it.y + d.h && y + h > it.y) return false;
  }
  return true;
}
function firstFree(type, rot){
  const t = TYPES[type];
  const w = rot ? t.h : t.w, h = rot ? t.w : t.h;
  if(w > state.size || h > state.size) return null;
  for(let y = 0; y <= state.size - h; y++)
    for(let x = 0; x <= state.size - w; x++)
      if(canPlace(type, rot, x, y)) return { x, y };
  return null;
}

/* ============================ çizim ============================ */
function render(){
  roomEl.style.setProperty("--n", state.size);
  roomEl.style.setProperty("--floor", floorColor());
  sizeInput.value = state.size;
  sizeEcho.textContent = state.size;
  renderItems();
  renderStats();
  renderBar();
  renderMode();
  save();
}

function renderItems(){
  const n = state.size;
  const cell = roomEl.clientWidth / n;
  let html = "";
  for(const it of state.items){
    const t = TYPES[it.type], d = dims(it);
    const light = luminance(t.color) > 0.62;
    const fg = light ? "#2b2724" : "#ffffff";
    const emoji = Math.max(10, Math.min(cell * Math.min(d.w, d.h) * 0.5, 44));
    const label = Math.max(9, Math.min(cell * 0.3, 12));
    html += `<div class="item${it.uid === sel ? " sel" : ""}${drag && drag.uid === it.uid && drag.active ? " dragging" : ""}"
      data-uid="${it.uid}"
      style="left:${it.x / n * 100}%;top:${it.y / n * 100}%;width:${d.w / n * 100}%;height:${d.h / n * 100}%;
             background:${rgba(t.color, .93)};color:${fg};border-color:${rgba("#000000", .32)};
             font-size:${label}px">
      <span class="ico" style="font-size:${emoji}px">${t.emoji}</span>
      ${cell >= 44 ? `<span class="lbl">${t.name}</span>` : ""}
    </div>`;
  }
  itemsEl.innerHTML = html;
}

function renderStats(){
  const area = state.items.reduce((s, it) => { const d = dims(it); return s + d.w * d.h; }, 0);
  const pct = Math.round(area / (state.size * state.size) * 100);
  statsEl.innerHTML = `Oda <b>${state.size}×${state.size}</b> · Eşya <b>${state.items.length}</b> · Doluluk <b>%${pct}</b>`;
}

function renderBar(){
  const it = state.items.find(i => i.uid === sel);
  const on = !!it;
  $("#rotBtn").disabled = !on;
  $("#dupBtn").disabled = !on;
  $("#delBtn").disabled = !on;
  if(it){
    const t = TYPES[it.type], d = dims(it);
    selChip.hidden = false;
    selChip.innerHTML = `<b>${t.emoji} ${t.name}</b> · ${d.w}×${d.h} · konum ${it.x + 1},${it.y + 1}`;
  }else{
    selChip.hidden = true;
  }
}

function renderMode(){
  modeEl.className = armed ? "flash" : "";
  modeEl.innerHTML = armed
    ? `Yerleştiriliyor: <b>${TYPES[armed.type].emoji} ${TYPES[armed.type].name}</b> (R: döndür · Esc: bitir)`
    : "";
  const handBtn = $("#handBtn");
  if(handBtn) handBtn.classList.toggle("armed", !armed);
}

function flash(msg){
  clearTimeout(flashTimer);
  hintEl.classList.add("flash");
  hintEl.textContent = msg;
  flashTimer = setTimeout(() => {
    hintEl.classList.remove("flash");
    hintEl.innerHTML = DEFAULT_HINT;
  }, 2400);
}

/* ============================ katalog ============================ */
function buildCatalog(){
  let html = `<button class="hand" id="handBtn">✋ El / seçim modu</button>`;
  for(const g of CATALOG){
    html += `<div class="grp"><h3>${g.icon} ${g.cat}</h3><div class="cards">`;
    for(const t of g.items){
      html += `<div class="card" data-type="${t.id}" role="button" tabindex="0">
        <span class="chip" style="background:${rgba(t.color, .22)}">${t.emoji}</span>
        <span class="nm">${t.name}</span>
        <span class="sz">${t.w}×${t.h}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  catList.innerHTML = html;
}

function buildFloors(){
  $("#floors").innerHTML = FLOORS.map(f =>
    `<button class="sw" data-floor="${f.id}" title="${f.name}" aria-pressed="${f.id === state.floor && !state.floorColor}"
      style="background:${f.color}"></button>`).join("");
}

function buildPalette(){
  $("#palGrid").innerHTML = PALETTE.map(c =>
    `<button class="pal-sw" data-color="${c}" title="${c}" style="background:${c}"></button>`).join("");
}

function setFloorColor(hex){
  state.floorColor = hex;
  buildFloors();
  render();
  flash(`Zemin rengi ${hex} oldu.`);
}

function openPal(open){
  palOpen = open;
  $("#pal").hidden = !open;
  $("#palBtn").setAttribute("aria-expanded", String(open));
}

$("#palBtn").addEventListener("click", e => {
  e.stopPropagation();
  openPal(!palOpen);
});
document.addEventListener("pointerdown", e => {
  if(palOpen && !e.target.closest(".pal-wrap")) openPal(false);
});
$("#palGrid").addEventListener("click", e => {
  const b = e.target.closest(".pal-sw");
  if(!b) return;
  setFloorColor(b.dataset.color);
});
$("#palCustom").addEventListener("input", e => {
  if(/^#[0-9a-f]{6}$/i.test(e.target.value)) setFloorColor(e.target.value);
});

/* ============================ önizleme ============================ */
function showPreview(type, rot, x, y, ignoreUid){
  const ok = canPlace(type, rot, x, y, ignoreUid);
  const t = TYPES[type];
  const w = rot ? t.h : t.w, h = rot ? t.w : t.h;
  const n = state.size;
  previewEl.hidden = false;
  previewEl.className = `item preview ${ok ? "ok" : "bad"}`;
  previewEl.style.cssText =
    `left:${x / n * 100}%;top:${y / n * 100}%;width:${w / n * 100}%;height:${h / n * 100}%;` +
    `font-size:12px;color:${ok ? "#0d2b17" : "#fff"}`;
  const cell = roomEl.clientWidth / n;
  const emoji = Math.max(10, Math.min(cell * Math.min(w, h) * 0.5, 44));
  previewEl.innerHTML = `<span class="ico" style="font-size:${emoji}px">${t.emoji}</span>` +
    (cell >= 44 ? `<span class="lbl">${t.name}</span>` : "");
  return ok;
}
function hidePreview(){ previewEl.hidden = true; }

function showGhost(type, x, y){
  const t = TYPES[type];
  ghostEl.hidden = false;
  ghostEl.innerHTML = `<span style="font-size:17px">${t.emoji}</span>${t.name}`;
  ghostEl.style.left = x + "px";
  ghostEl.style.top = y + "px";
}
function hideGhost(){ ghostEl.hidden = true; }

/* ============================ pointer akışı ============================ */
function cellAt(cx, cy){
  const r = roomEl.getBoundingClientRect();
  if(cx < r.left || cy < r.top || cx > r.right || cy > r.bottom) return null;
  const n = state.size;
  const x = Math.floor((cx - r.left) / r.width * n);
  const y = Math.floor((cy - r.top) / r.height * n);
  return { x: Math.max(0, Math.min(n - 1, x)), y: Math.max(0, Math.min(n - 1, y)) };
}

function updateDrag(e){
  lastPt = { x:e.clientX, y:e.clientY };
  const c = cellAt(e.clientX, e.clientY);
  if(c){
    drag.cell = c;
    drag.ok = showPreview(drag.type, drag.rot, c.x, c.y, drag.uid || undefined);
    hideGhost();
  }else{
    drag.cell = null;
    hidePreview();
    showGhost(drag.type, e.clientX, e.clientY);
  }
}

function updateArmedHover(e){
  if(!armed) return;
  lastPt = { x:e.clientX, y:e.clientY };
  const c = cellAt(e.clientX, e.clientY);
  if(c) showPreview(armed.type, armed.rot, c.x, c.y);
  else hidePreview();
}

function commitDrop(){
  const c = drag.cell;
  if(!c || !canPlace(drag.type, drag.rot, c.x, c.y, drag.uid || undefined)){
    flash("Buraya sığmaz — başka bir kareye bırak.");
    return false;
  }
  if(drag.uid){
    const it = state.items.find(i => i.uid === drag.uid);
    if(it){ it.x = c.x; it.y = c.y; it.rot = drag.rot; sel = it.uid; }
  }else{
    const it = { uid:uid(), type:drag.type, x:c.x, y:c.y, rot:drag.rot };
    state.items.push(it);
    sel = it.uid;
  }
  return true;
}

function cancelDrag(){
  hidePreview(); hideGhost();
  if(drag){ drag.active = false; drag = null; }
}

/* ---------- katalog: sürükle veya tıkla ---------- */
catList.addEventListener("pointerdown", e => {
  const card = e.target.closest(".card");
  if(!card) return;
  e.preventDefault();
  drag = {
    source:"catalog", type:card.dataset.type, rot:0, uid:null,
    startX:e.clientX, startY:e.clientY, active:false, cell:null, ok:false
  };
  lastPt = { x:e.clientX, y:e.clientY };
});

catList.addEventListener("click", e => {
  if(e.target.closest("#handBtn")){
    armed = null; hidePreview(); renderMode(); renderCatalogArmed();
    flash("El modu: eşya seçmek için kareye tıkla.");
  }
});

function renderCatalogArmed(){
  catList.querySelectorAll(".card").forEach(c => {
    c.classList.toggle("armed", !!armed && c.dataset.type === armed.type);
  });
  renderMode();
}

/* ---------- oda: yerleştirme / seçme / taşıma ---------- */
roomEl.addEventListener("pointerdown", e => {
  const el = e.target.closest(".item");
  if(el){
    const it = state.items.find(i => i.uid === el.dataset.uid);
    if(!it) return;
    e.preventDefault();
    sel = it.uid;
    renderBar(); renderItems();
    drag = {
      source:"item", type:it.type, rot:it.rot, uid:it.uid,
      startX:e.clientX, startY:e.clientY, active:false, cell:null, ok:false
    };
    lastPt = { x:e.clientX, y:e.clientY };
    return;
  }

  const c = cellAt(e.clientX, e.clientY);
  if(armed && c){
    e.preventDefault();
    if(canPlace(armed.type, armed.rot, c.x, c.y)){
      const it = { uid:uid(), type:armed.type, x:c.x, y:c.y, rot:armed.rot };
      state.items.push(it);
      sel = it.uid;
      hidePreview();
      render();
      flash(`${TYPES[armed.type].name} eklendi — yeni kareye tıklayarak devam et.`);
    }else{
      flash("Bu kare dolu ya da sığmıyor.");
    }
    return;
  }
  if(sel){ sel = null; renderBar(); renderItems(); }
});

document.addEventListener("pointermove", e => {
  if(drag){
    if(!drag.active){
      const d = Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
      if(d > 5){
        drag.active = true;
        if(drag.uid) renderItems();   // taşınan eşya soluklaşsın
      }
    }
    if(drag.active) updateDrag(e);
    else lastPt = { x:e.clientX, y:e.clientY };
    return;
  }
  updateArmedHover(e);
}, { passive:true });

function endPointer(e){
  if(!drag) return;
  if(drag.active){
    if(drag.cell && drag.ok){
      const wasMove = !!drag.uid;
      if(commitDrop()){
        render();
        flash(wasMove ? "Eşya taşındı." : `${TYPES[drag.type].name} yerleştirildi.`);
      }else{
        render();
      }
    }else{
      if(drag.uid) renderItems();
      flash("Geçersiz kare — eski yerine döndü.");
    }
    hidePreview(); hideGhost();
    drag = null;
    renderBar();
    return;
  }
  // hareket yok → tık sayılır: katalog kartı yerleştirme modunu açar
  const source = drag.source, type = drag.type;
  drag = null;
  if(source === "catalog"){
    if(armed && armed.type === type){ armed = null; flash("Yerleştirme modu kapatıldı."); }
    else{ armed = { type, rot:0 }; flash(`${TYPES[type].name} seçildi — odaya tıklayarak yerleştir (R: döndür).`); }
    renderCatalogArmed();
  }
}
document.addEventListener("pointerup", endPointer);
document.addEventListener("pointercancel", () => {
  if(drag){
    if(drag.active && drag.cell && drag.ok && commitDrop()){
      flash(`${TYPES[drag.type].name} yerleşti.`);
    }else if(!drag.uid && drag.type){
      // dokunmatikte kaydırma iptal olursa: katalog eşyası modda kalır, kareye dokunarak yerleştir
      armed = { type:drag.type, rot:drag.rot };
      renderCatalogArmed();
    }
    drag = null;
    hidePreview(); hideGhost();
  }
  render();
});

/* ---------- klavye ---------- */
document.addEventListener("keydown", e => {
  if(e.target.matches("input, textarea")) return;
  const k = e.key;

  if(k === "Escape"){
    if(!$("#saveModal").hidden){ closeSave(); return; }
    if(palOpen){ openPal(false); return; }
    if(drag) cancelDrag();
    armed = null; sel = null;
    hidePreview(); hideGhost();
    render(); renderCatalogArmed();
    return;
  }
  if(k === "r" || k === "R"){
    if(drag && drag.active){
      drag.rot ^= 1;
      if(lastPt) updateDrag(drag);
    }else if(armed){
      armed.rot ^= 1;
      if(lastPt) updateArmedHover(lastPt);
      renderMode();
    }else if(sel){
      rotateSelected();
    }
    return;
  }
  if(k === "Delete" || k === "Backspace"){
    if(sel){ e.preventDefault(); deleteSelected(); }
    return;
  }
  if(k === "Enter" && !armed){
    const card = document.activeElement && document.activeElement.closest(".card");
    if(card){ armed = { type:card.dataset.type, rot:0 }; renderCatalogArmed(); }
  }
});

/* ---------- seçili eşya işlemleri ---------- */
function rotateSelected(){
  const it = state.items.find(i => i.uid === sel);
  if(!it) return;
  const next = it.rot ^ 1;
  if(canPlace(it.type, next, it.x, it.y, it.uid)){ it.rot = next; render(); }
  else flash("Döndürmek için yeterli yer yok.");
}
function deleteSelected(){
  const it = state.items.find(i => i.uid === sel);
  if(!it) return;
  state.items = state.items.filter(i => i.uid !== sel);
  sel = null; render();
  flash(`${TYPES[it.type].name} silindi.`);
}
function duplicateSelected(){
  const it = state.items.find(i => i.uid === sel);
  if(!it) return;
  const spot = firstFree(it.type, it.rot);
  if(!spot){ flash("Boş yer kalmadı."); return; }
  const copy = { uid:uid(), type:it.type, x:spot.x, y:spot.y, rot:it.rot };
  state.items.push(copy); sel = copy.uid; render();
  flash("Kopyası eklendi.");
}

$("#rotBtn").addEventListener("click", rotateSelected);
$("#delBtn").addEventListener("click", deleteSelected);
$("#dupBtn").addEventListener("click", duplicateSelected);

/* ---------- başlık kontrolleri ---------- */
function applySize(){
  let v = Math.round(Number(sizeInput.value));
  if(!Number.isFinite(v)) v = state.size;
  v = Math.min(MAX, Math.max(MIN, v));
  sizeInput.value = v;
  const before = state.items.length;
  state.size = v;
  state.items = state.items.filter(inBounds);
  if(sel && !state.items.some(i => i.uid === sel)) sel = null;
  render();
  const dropped = before - state.items.length;
  flash(dropped > 0
    ? `Oda ${v}×${v} oldu · sığmayan ${dropped} eşya çıkarıldı.`
    : `Oda ${v}×${v} oldu.`);
}
sizeInput.addEventListener("change", applySize);
sizeInput.addEventListener("keydown", e => { if(e.key === "Enter") applySize(); });

$("#floors").addEventListener("click", e => {
  const b = e.target.closest(".sw");
  if(!b) return;
  state.floor = b.dataset.floor;
  state.floorColor = null;
  buildFloors();
  render();
});

$("#clearBtn").addEventListener("click", () => {
  if(!state.items.length){ flash("Oda zaten boş."); return; }
  if(!confirm("Odadaki tüm eşyalar silinsin mi?")) return;
  state.items = []; sel = null; armed = null;
  render(); renderCatalogArmed();
  flash("Oda temizlendi.");
});

/* ---------- görsel kaydetme (PNG) ---------- */
function roundRectPath(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawRoom(){
  const n = state.size, cell = 72, S = n * cell;
  const cv = document.createElement("canvas");
  cv.width = S; cv.height = S;
  const ctx = cv.getContext("2d");

  ctx.fillStyle = floorColor();
  ctx.fillRect(0, 0, S, S);

  ctx.strokeStyle = "rgba(0,0,0,.16)";
  ctx.lineWidth = Math.max(1, Math.round(cell * 0.02));
  ctx.beginPath();
  for(let i = 0; i <= n; i++){
    const p = Math.round(i * cell) + .5;
    ctx.moveTo(p, 0); ctx.lineTo(p, S);
    ctx.moveTo(0, p); ctx.lineTo(S, p);
  }
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for(const it of state.items){
    const t = TYPES[it.type], d = dims(it);
    const x = it.x * cell, y = it.y * cell, w = d.w * cell, h = d.h * cell;
    roundRectPath(ctx, x + 3, y + 3, w - 6, h - 6, 11);
    ctx.fillStyle = rgba(t.color, .95);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "rgba(0,0,0,.38)";
    ctx.stroke();

    const em = Math.max(13, Math.min(Math.min(w, h) * 0.5, 48));
    const showLabel = Math.min(w, h) >= 52;
    ctx.font = `${em}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.fillStyle = "#000";
    if(showLabel){
      ctx.fillText(t.emoji, x + w / 2, y + h / 2 - 11);
      ctx.font = `700 ${Math.min(cell * 0.28, 15)}px system-ui,sans-serif`;
      ctx.fillStyle = luminance(t.color) > .62 ? "#2b2724" : "#ffffff";
      ctx.fillText(t.name, x + w / 2, y + h / 2 + em * 0.62);
    }else{
      ctx.fillText(t.emoji, x + w / 2, y + h / 2);
    }
  }

  ctx.strokeStyle = "rgba(43,39,36,.8)";
  ctx.lineWidth = 7;
  ctx.strokeRect(3.5, 3.5, S - 7, S - 7);
  return cv;
}

function openSave(){
  try{
    const url = drawRoom().toDataURL("image/png");
    $("#saveImg").src = url;
    const link = $("#saveLink");
    link.href = url;
    link.download = `oda-plani-${state.size}x${state.size}.png`;
    $("#saveModal").hidden = false;
  }catch(err){
    flash("Görsel oluşturulamadı, tekrar dene.");
  }
}
function closeSave(){
  $("#saveModal").hidden = true;
  $("#saveImg").removeAttribute("src");
}
$("#saveBtn").addEventListener("click", openSave);
$("#saveClose").addEventListener("click", closeSave);
$("#saveModal").addEventListener("click", e => { if(e.target.id === "saveModal") closeSave(); });

/* ---------- genel ---------- */
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("contextmenu", e => { if(e.target.closest(".room, .card")) e.preventDefault(); });

let resizeRaf = null;
window.addEventListener("resize", () => {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(renderItems);
});

/* ---------- başlat ---------- */
load();
buildCatalog();
buildFloors();
buildPalette();
render();
renderCatalogArmed();
requestAnimationFrame(renderItems);

})();
</script>
